name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ env.CONFIGURATION }}

      - name: Test
        run: dotnet test --no-build -c ${{ env.CONFIGURATION }} --verbosity normal

      - name: Publish
        run: dotnet publish CVAnalyzer.API/CVAnalyzerAPI.csproj --no-restore -c ${{ env.CONFIGURATION }} -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvanalyzer-api
          path: ./publish
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-test
    # Deploy only on push to master, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cvanalyzer-api
          path: ./publish

      - name: Deploy to server via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/cvanalyzer' }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'cvanalyzer-api' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          SSH_CMD="ssh -p $DEPLOY_PORT -i $HOME/.ssh/id_deploy"

          # Ensure the target directory exists on the server
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/current'"

          # Sync the published app to the server (removes stale files)
          rsync -az --delete \
            -e "ssh -p $DEPLOY_PORT -i $HOME/.ssh/id_deploy" \
            ./publish/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/current/"

          # Restart the application service
          $SSH_CMD "$DEPLOY_USER@$DEPLOY_HOST" "sudo systemctl restart '$SERVICE_NAME'"
